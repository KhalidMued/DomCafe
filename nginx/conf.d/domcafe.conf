limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=order_create:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=order_event_connects:10m rate=30r/m;

limit_conn_zone $binary_remote_addr zone=order_events:1m;

server {
    listen 80;
    server_name _;

    # Only the local tunnel reaches the published origin port. Cloudflare sets
    # X-Forwarded-Proto to the visitor scheme; never redirect the internal hop.
    if ($http_x_forwarded_proto = http) {
        return 308 https://dom.khalidmued.com$request_uri;
    }

    # Cloudflare Tunnel traffic arrives from the Docker host/network as a
    # single source IP; restore the real client IP from CF-Connecting-IP so
    # limit_req and the backend rate limits key on the actual visitor.
    # Direct LAN/Tailscale clients are outside 172.16.0.0/12, so they cannot
    # spoof the header.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    include /etc/nginx/conf.d/security-headers.inc;
    limit_req_status 429;

    location = /api/admin/login {
        limit_req zone=admin_login burst=4 nodelay;
        proxy_pass http://backend:8000/api/admin/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    location = /api/admin/login/ {
        limit_req zone=admin_login burst=4 nodelay;
        proxy_pass http://backend:8000/api/admin/login/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    location = /api/orders {
        limit_req zone=order_create burst=9 nodelay;
        proxy_pass http://backend:8000/api/orders;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    location = /api/orders/ {
        limit_req zone=order_create burst=9 nodelay;
        proxy_pass http://backend:8000/api/orders/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    # Only event streams consume this per-client connection budget.
    location ~ ^/api/(admin/orders|orders/[^/]+)/events/?$ {
        limit_req zone=order_event_connects burst=20 nodelay;
        limit_conn order_events 10;
        limit_conn_status 429;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 45s;
        send_timeout 45s;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    location /uploads/ {
        alias /app/uploads/;
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
